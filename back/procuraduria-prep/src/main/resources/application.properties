spring.application.name=procuraduria-prep
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/procuraduria_prep}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=${DOCUMENT_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${DOCUMENT_MAX_FILE_SIZE:10MB}
app.documents.max-file-size-bytes=${DOCUMENT_MAX_FILE_SIZE_BYTES:10485760}
app.documents.storage-dir=${DOCUMENT_STORAGE_DIR:./data/documents}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.connect-timeout=${GEMINI_CONNECT_TIMEOUT:3s}
app.ai.gemini.response-timeout=${GEMINI_RESPONSE_TIMEOUT:6s}
app.ai.primary-provider=${AI_PRIMARY_PROVIDER:groq}
app.ai.fallback.enabled=${AI_FALLBACK_ENABLED:true}
app.ai.groq.model=${GROQ_MODEL:}
app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.ai.groq.connect-timeout=${GROQ_CONNECT_TIMEOUT:3s}
app.ai.groq.response-timeout=${GROQ_RESPONSE_TIMEOUT:30s}
app.ai.groq.max-completion-tokens=${GROQ_MAX_COMPLETION_TOKENS:3000}
